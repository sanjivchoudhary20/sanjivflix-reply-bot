name: "3 - Auto Reply (bina dekhe)"
#ok
# Har 15 minute apne aap chalta hai aur naye comments ka seedha reply bhejta hai.
# Band karna ho to: Actions > 3 - Auto Reply > "..." > Disable workflow

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: reply-bot
  cancel-in-progress: false

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Reply banao aur seedha bhejo
        run: python -u reply_bot.py auto 30
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      # Hafte mein ek baar chhota sa update, taaki GitHub 60 din baad schedule band na kare
      - name: Weekly keep-alive
        if: always()
        run: |
          date -u +%G-W%V > last_active.txt
          git config user.name "sanjivflix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_active.txt
          git diff --cached --quiet || (git commit -m "Weekly keep-alive" && git push)
