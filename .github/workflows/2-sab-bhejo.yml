name: "2 - Sab Bhejo"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reply-bot
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Saare reply Facebook par bhejo
        run: python -u reply_bot.py send
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: drafts.txt saaf karo
        run: |
          git config user.name "sanjivflix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts.txt
          git diff --cached --quiet || git commit -m "Drafts bhej diye"
          git push
